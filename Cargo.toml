[package]
name = "tritongue"
version = "0.1.0"
edition = "2021"

[lib]
name = "trinity"
path = "src/lib.rs"

[[bin]]
name = "tritongue"
path = "src/bin/main.rs"

[features]
default = ["python", "wasm"]
wasm = ["dep:wasmtime"]
python = ["dep:pyo3", "dep:pyo3-ffi", "dep:pyo3-asyncio-0-21"]

[dependencies]
anyhow = "1.0.66"
directories = "5.0.1"
dirs = "^5"
dotenvy = "0.15.6"
futures = "0.3.25"
matrix-sdk = "^0.7"
matrix-sdk-base = "^0.7"
matrix-sdk-sqlite = "^0.7"
notify = "5.0.0"
rand = "0.8.5"
redb = "0.9.0"
regex = "1.11.1"
reqwest = { version = "0.11.12", features = ["json", "blocking"] }
signal-hook = "0.3.15"
signal-hook-tokio = { version = "0.3.1", features = ["futures-v0_3"] }
serde = { version = "1.0.152", features = ["derive"] }
tokio = { version = "1.24.2", features = ["rt-multi-thread", "macros", "io-std"] }
tokio-stream = "^0.1"
tokio-util = "^0.7"
toml = "0.5.10"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"
wasmtime = { version = "14.0.0", features = ["component-model"], optional = true }
pyo3-asyncio-0-21 = { version="^0.21", features = ["attributes", "tokio-runtime"], optional = true }
pyo3 = { version = "^0.21", features = [ "auto-initialize" ], optional = true }
pyo3-ffi = { version = "^0.21", optional = true }
